<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Hoyoung Kim — AI Engineer</title>
<desc id="desc">Dark navy portfolio banner with mint accents and an abstract data-to-model pipeline visualization.</desc>
<defs>
